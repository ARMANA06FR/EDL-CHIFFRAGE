<!doctype html>

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
<style>

:root[data-theme="dark"]{--bg:#11191d;--card:#1a252b;--ink:#e6eef1;--mut:#93a4ad;--line:#2c3a42;--acc:#4fb3d3;--accf:#08202a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap}
.top h1{font:600 20px 'Barlow Condensed',Barlow,sans-serif;margin:0;flex:1}
#st{font-size:13px;color:var(--mut)}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:0 12px 8px}
.tb{flex:none;border:1px solid var(--line);background:none;color:var(--ink);padding:7px 12px;border-radius:8px;font:inherit;font-size:14px}
.tb.on{background:var(--acc);border-color:var(--acc);color:var(--accf)}
main{max-width:760px;margin:0 auto;padding:12px;padding-bottom:80px}
h2{font:600 22px 'Barlow Condensed',Barlow,sans-serif;margin:18px 0 8px}
h3{font-size:15px;margin:16px 0 6px;color:var(--mut);font-weight:600}
h3.strong{color:var(--ink);font-weight:700;font-size:16px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.f{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:3px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.seg{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px}
.seg>span{color:var(--mut);margin-right:4px}
.it{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
.it.warn{background:#fdf0dd;border-color:var(--eu);border-width:2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .it.warn{background:#3a2f1a}}
:root[data-theme="dark"] .it.warn{background:#3a2f1a}
.it.filled{background:#eaf6ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .it.filled{background:#16281c}}
:root[data-theme="dark"] .it.filled{background:#16281c}
.badge{font-size:11px;padding:3px 8px;border-radius:12px;font-weight:600;flex:none}
.badge.deg{background:#fbe4e6;color:#c62f3b}
.badge.better{background:#e8f5ec;color:#2e8b57}
.badge.diff,.badge.same{background:#eef1f2;color:#5d6d76}
.mini.d{border-color:var(--hs);color:var(--hs)}
.tb .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--be);margin-left:5px;vertical-align:middle}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.hd b{flex:1}
.hd select{width:auto;max-width:50%;padding:5px}
.mini{border:1px solid var(--line);background:none;color:var(--mut);border-radius:7px;width:26px;height:26px;font:inherit;font-size:15px;line-height:1;flex:none}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.c{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:8px 12px;min-height:40px;font:inherit;font-size:14px;font-weight:500}
.c.on{background:var(--c,var(--acc));border-color:var(--c,var(--acc));color:var(--t,var(--accf))}
.rsub{margin:4px 0 0;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.rsub .c{padding:5px 9px;min-height:30px;font-size:12px;font-weight:400;opacity:.8;border-radius:7px}
.rsub .c.on{opacity:1}
.tc{width:90px!important;flex:none}
.tc input{padding:5px}
.ob{margin-top:6px;min-height:38px;resize:none;overflow:hidden}
.btn{display:inline-block;border:1px solid var(--acc);color:var(--acc);background:none;border-radius:8px;padding:9px 14px;font:inherit;font-size:15px;font-weight:500}
.btn.p{background:var(--acc);color:var(--accf)}
.btn.d{border-color:var(--hs);color:var(--hs)}
.btn.sm{padding:6px 10px;font-size:13px}
.lg{font-size:13px;color:var(--mut);margin:0 0 6px}
.ph{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ph div{position:relative}
.ph img{width:96px;height:96px;object-fit:cover;border-radius:8px}
.ph button{position:absolute;top:2px;right:2px;border:0;background:#000a;color:#fff;border-radius:50%;width:24px;height:24px}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
canvas.sg{width:100%;height:225px;background:#fff;border:1px solid var(--line);border-radius:8px;touch-action:none}
canvas.sg.locked{border-color:var(--be);border-width:2px}
.act{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;align-items:center}
.cn{grid-template-columns:repeat(auto-fit,minmax(72px,1fr));margin:6px 0}
#qb{display:none;position:fixed;left:0;right:0;bottom:0;gap:6px;overflow-x:auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);z-index:9}
#qb button{flex:none;border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px}
#recap{display:none}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex}
#modal .card{background:var(--card);color:var(--ink);border-radius:12px;padding:18px;max-width:380px;width:100%;max-height:80vh;overflow:auto}
#modal .act button{text-align:left}
#recap.show{display:block;position:fixed;inset:0;background:var(--bg);color:var(--ink);overflow:auto;z-index:30;padding:16px}
#recap.show table{border-collapse:separate;border-spacing:0 6px;width:100%;margin:6px 0 14px;font-size:13px}
#recap.show td,#recap.show th{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
#recap.show tr td:first-child,#recap.show tr th:first-child{border-radius:8px 0 0 8px}
#recap.show tr td:last-child,#recap.show tr th:last-child{border-radius:0 8px 8px 0}
#recap.show th{background:#eef3f5;font-weight:600}
#recap.show img{max-width:160px;margin:3px}
#recap.show .hdband{background:#0e6d8c;color:#fff;border-radius:12px;padding:16px 20px;margin-bottom:12px}
#recap.show .hdband .brand{font-weight:800;font-size:20px;letter-spacing:.06em;display:block}
#recap.show .hdband .sub{font-size:13px;opacity:.9}
#recap.show .sum{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
#recap.show .sc{font-size:12px;padding:5px 10px;border-radius:20px;color:#333;font-weight:500}
#rcls{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:31}
@media print{header,main,#rcls{display:none}#recap{display:block;color:#000;background:#fff}}
</style>
</head>

function ageFromEtat(item,etat){if(!item||item.V==null)return 0;return item.V*(ETAT_FRACTION[etat]??0)}
function occYearsFromS(){
  const dEnt=S.v.dent||(S.baseline&&S.baseline.v&&S.baseline.v.date)||'';
  const dSor=S.v.date||'';
  if(!dEnt||!dSor)return 0;
  const d1=new Date(dEnt),d2=new Date(dSor);
  if(isNaN(d1)||isNaN(d2)||d2<d1)return 0;
  let months=(d2.getFullYear()-d1.getFullYear())*12+(d2.getMonth()-d1.getMonth());
  if(d2.getDate()<d1.getDate())months-=1;
  return Math.max(0,months)/12;
}
function occPartsFromS(){
  const y=occYearsFromS();
  const totalM=Math.round(y*12);
  return {years:Math.floor(totalM/12),months:totalM%12};
}

function computeShare(item,age){
  if(!item||item.V==null||item.F==null||item.A==null||item.R==null)return 100;
  if(age<=item.F)return 100;
  if(age<=item.V){let share=100-(age-item.F)*item.A;return Math.max(share,item.R)}
  return item.R;
}
function computeCoef(item,etat,typeT){
  if(typeT===1)return 1;
  if(!item||item.V==null)return 1;
  const age0=ageFromEtat(item,etat);
  const age=age0+occYearsFromS();
  const share=computeShare(item,age);
  return Math.round((share/100)*1000)/1000;
}

function suggestCatalog(name,obs,flag1,flag2,roomLabel){
  const q=(name+' '+(obs||'')+' '+(roomLabel||'')).toLowerCase();
  const rn=(roomLabel||'').toLowerCase();
  const scored=GRILLE.map(item=>{
    const lib=item.lib.toLowerCase();
    const cat=(item.cat||'').toLowerCase();
    let sc=0;
    const exact=EXACT_MAP[name];
    if(exact){
      exact.forEach(kw=>{
        const k=kw.toLowerCase();
        if(lib.includes(k))sc+=10;
      });
    }
    for(const pair of MAP_KW){
      if(pair[0].test(q)){
        pair[1].forEach(k=>{if(lib.includes(k.toLowerCase()))sc+=3});
      }
    }
    name.toLowerCase().split(/[\s\/\-',']+/).forEach(w=>{
      if(w.length>3&&lib.includes(w))sc+=2;
    });
    // Room-aware peinture / sols
    if(cat.includes('peinture')||cat.includes('sols')){
      if(/(salon|séjour)/.test(rn)&&/salon|séjour/.test(lib))sc+=6;
      if(/chambre/.test(rn)&&/chambre/.test(lib))sc+=6;
      if(/cuisine/.test(rn)&&/cuisine/.test(lib))sc+=6;
      if(/entrée|dégagement/.test(rn)&&/entrée|dégagement|cellier/.test(lib))sc+=6;
      if(/bain|sdb|eau/.test(rn)&&/(bain|eau|sdb)/.test(lib))sc+=6;
      if(/\bwc\b/.test(rn)&&/\bwc\b/.test(lib))sc+=6;
      // generic "pièce complète" as moderate fallback
      if(/pièce complète/.test(lib))sc+=2;
    }
    // Boost "complet" replacements for equipment
    if(/complet/.test(lib)&&exact)sc+=4;
    if(/remplacement complet/.test(lib))sc+=3;
    // Penalize "supplémentaire" and pure dépose as primary match
    if(/supplémentaire/.test(lib))sc-=5;
    if(/^dépose /.test(lib))sc-=3;
    if(/au-delà de 5/.test(lib))sc-=4;
    // Nettoyage preference
    if(flag2&&!flag1&&cat.includes('nettoyage'))sc+=6;
    if(flag1&&cat.includes('taux horaire'))sc+=1;
    // Don't let rebouchage win for generic "Murs" état degradation
    if(/rebouchage/.test(lib)&&!/trch|trous|chevilles/.test(q))sc-=8;
    return {item,sc};
  }).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc||a.item.prix-b.item.prix);
  return scored.slice(0,8).map(x=>x.item);
}

function trchDiffFor(sk){
  // sk is state key ending with 's' (e.g. r1.t0s) or full key
  if(!sk||typeof sk!=='string')return 0;
  const base=sk.endsWith('s')&&!sk.endsWith('ss')?sk.slice(0,-1):sk;
  // avoid inventaire/clés fake keys
  if(base.indexOf('qtydeg')>=0||base.indexOf('iv')===0&&base.indexOf('.')>0)return 0;
  const bv=(S.baseline&&S.baseline.v)||{};
  const t1=parseInt(bv[base+'t'])||0;
  const t2=parseInt(S.v[base+'t'])||0;
  return Math.max(0,t2-t1);
}
function collectTrchLines(){
  // Scan all room elements for TrCh increase even without état change
  if(!S.baseline)return [];
  const bv=S.baseline.v||{};
  const out=[];
  S.rooms.forEach(r=>{
    const ex=S.x[r.id]||[];
    const defs=TPL[r.t]?TPL[r.t].i:[];
    defs.forEach((x,i)=>{
      const k=r.id+'.t'+i;
      const t1=parseInt(bv[k+'t'])||0,t2=parseInt(S.v[k+'t'])||0;
      const d=t2-t1;

function pickNettoyageTier(){
  const raw=(S.v.typ||'').toString().trim().toUpperCase();
  // Explicit T1…T6 or F1…F6 in the type field
  let m=raw.match(/\b[TF]([1-6])\b/);
  if(m)return 'T'+m[1];
  // "T6 et plus", "T6+", "6 pièces", etc.
  if(/\bT\s*6\b|\b6\s*\+|ET\s*PLUS/.test(raw))return 'T6';
  if(/\bSTUDIO\b|\bT0\b|\bF0\b/.test(raw))return 'T1';
  // Number of pieces written as "3 pièces" / "type 4"
  m=raw.match(/\b([1-6])\s*(PI[EÈ]CES?|P\b)/);
  if(m)return 'T'+m[1];
  m=raw.match(/\bTYPE\s*([1-6])\b/);
  if(m)return 'T'+m[1];
  // Fallback: count main rooms (exclude WC; count SDB as room)
  const n=S.rooms.filter(r=>{
    const t=r.t||'', name=(r.n||'').toLowerCase();
    if(t==='wc'||/\bwc\b/.test(name))return false;
    return true;
  }).length;
  if(n<=1)return 'T1';
  if(n===2)return 'T2';
  if(n===3)return 'T3';
  if(n===4)return 'T4';
  if(n===5)return 'T5';
  return 'T6';
}

            prix:reb?reb.prix:15,
            etat:'BE',
            coef:1,
            typeT:1,
            grille:reb||null,
            srcName:srcTrch,
            srcObs:'Trous de chevilles : '+(td)+' supplémentaire(s)',
            suggestions:[]
          });
        }
      }
      // Dégradation d'état réelle (sévérité sortie > entrée) ?
      const SEV={NF:0,BE:1,EU:2,ME:3,HS:4};
      const etatDeg=!!(
        (x.s1&&x.s2&&x.s1!==x.s2&&SEV[x.s1]!==undefined&&SEV[x.s2]!==undefined&&SEV[x.s2]>SEV[x.s1])||
        (x.s2&&!x.s1&&SEV[x.s2]!==undefined&&SEV[x.s2]>=SEV.EU)
      );
      // Si seul le TrCh (+ éventuellement flags 1/2 sans baisse d'état) → pas de 2e ligne
      // Les flags « à réparer / à nettoyer » sur un simple TrCh sont déjà couverts par le rebouchage
      if(td>0&&!etatDeg)return;
      // Sans TrCh : ligne générique seulement si baisse d'état ou flags
      if(td<=0&&!etatDeg&&!x.flag1&&!x.flag2)return;
      if(room.lines.some(l=>l.srcName===x.name&&!String(l.srcName).includes('TrCh')))return;
      const etatEntree=(x.s1&&['NF','BE','EU'].includes(x.s1))?x.s1:'BE';
      const typeT=(x.flag1||x.flag2)?1:2;
      const suggestions=suggestCatalog(x.name,S.v[x.obsKey],x.flag1,x.flag2,x.roomLabel);
      const best=suggestions[0]||null;
      const coef=best?computeCoef(best,etatEntree,typeT):1;
      room.lines.push({
        id:S.chif.nextLineId++,
        lib:best?best.lib:(x.name+(x.flag1?' — à réparer':'')+(x.flag2?' — à nettoyer':'')),
        qty:1,
        unit:best?(best.unit||'u'):'u',
        prix:best?(best.prix||0):0,
        etat:etatEntree,
        coef:coef,
        typeT:typeT,
        grille:best,
        srcName:x.name,
        srcObs:S.v[x.obsKey]||'',
        suggestions:suggestions.slice(0,6)
      });
    });
  });
  Object.keys(byRoom).forEach(rn=>byRoom[rn].forEach(fn=>fn()));
  if((S.v.net==='Moyen'||S.v.net==='Médiocre')&&!!S.v['netg_flagimp']){
    const netTitle='État du nettoyage à la sortie';
    // Récupérer une éventuelle pièce créée sous l'ancien nom
    let room=S.chif.rooms.find(r=>r.name===netTitle||r.name==='Nettoyage général');
    if(room)room.name=netTitle;
    else{room={id:S.chif.nextRoomId++,name:netTitle,lines:[]};S.chif.rooms.push(room)}
    // Retirer d'éventuelles lignes génériques issues du comparatif (sans forfait T)
    room.lines=room.lines.filter(l=>l.srcName===netTitle||l.srcName==='Nettoyage'||(l.lib&&/^Forfait nettoyage T[1-6]/.test(l.lib)));
    if(!room.lines.some(l=>l.srcName===netTitle||l.srcName==='Nettoyage'||(l.lib&&/^Forfait nettoyage T[1-6]/.test(l.lib)))){
      const netAll=GRILLE.filter(g=>/^Forfait nettoyage T[1-6]/.test(g.lib));
      const pick=pickNettoyageTier();
      const netItem=netAll.find(g=>g.lib.indexOf('Forfait nettoyage '+pick)===0)||netAll.find(g=>g.lib.includes('T3'))||netAll[0];
      if(netItem){
        room.lines.push({
          id:S.chif.nextLineId++,
          lib:netItem.lib,
          qty:1,
          unit:'u',
          prix:netItem.prix,
          etat:'BE',
          coef:1,
          typeT:1,
          grille:netItem,
          srcName:netTitle,
          srcObs:(S.v.netgb||S.v.net||'')+(S.v.typ?' · Type log. : '+S.v.typ:''),
          suggestions:netAll
        });
      }
    }
  }
  msg('Chiffrage prérempli — vérifie chaque ligne (TrCh → rebouchage auto)');
  render();
}

function searchCatalogByQuery(q,limit){
  q=(q||'').toLowerCase().trim();
  if(!q||q.length<2)return [];
  const tokens=q.split(/\s+/).filter(Boolean);
  const scored=GRILLE.map(g=>{
    const hay=(g.lib+' '+g.cat).toLowerCase();
    let sc=0;
    if(hay.includes(q))sc+=10;
    tokens.forEach(t=>{if(hay.includes(t))sc+=3});
    // boost if all tokens present
    if(tokens.length&&tokens.every(t=>hay.includes(t)))sc+=5;
    return {g,sc};
  }).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc||a.g.prix-b.g.prix);
  return scored.slice(0,limit||12).map(x=>x.g);
}

function compareList(){
  if(!S.baseline)return [];
  const bv=S.baseline.v||{};
  const SEV={NF:0,BE:1,EU:2,ME:3,HS:4};
  const out=[];
  const add=(roomLabel,name,sk,obsKey,flagBase)=>{
    const s1=bv[sk],s2=S.v[sk];
    const flag1=flagBase?!!S.v[flagBase+'1']:false,flag2=flagBase?!!S.v[flagBase+'2']:false;
    const t1=flagBase?(parseInt(bv[flagBase+'t'])||0):0;
    const t2=flagBase?(parseInt(S.v[flagBase+'t'])||0):0;
    const trchDiff=Math.max(0,t2-t1);
    if(!s1&&!s2&&!flag1&&!flag2&&trchDiff<=0)return;
    let status='same';
    if(s1!==s2){
      if(SEV[s1]!==undefined&&SEV[s2]!==undefined)status=SEV[s2]>SEV[s1]?'deg':(SEV[s2]<SEV[s1]?'better':'same');
      else status='diff';
    }
    if(flag1||flag2)status='deg';
    if(trchDiff>0)status='deg';
    out.push({roomLabel,name,sk,obsKey,s1,s2,status,flag1,flag2,trch1:t1,trch2:t2,trchDiff,flagBase:flagBase||null});
  };
  S.rooms.forEach(r=>{
    const ex=S.x[r.id]||[];
    TPL[r.t].i.forEach((x,i)=>{const k=r.id+'.t'+i;add(r.n,x[0],k+'s',k+'b',k)});
    ex.forEach(e=>{const k=r.id+'.'+e.id;add(r.n,e.n,k+'s',k+'b',k)});
    if(r.t==='sdb'){SN.forEach((n,i)=>{const k='sn'+r.id+'.'+i+'.';add(r.n,n,k+'s',k+'b')});(S.san[r.id]||[]).forEach(eid=>{const k='sn'+r.id+'.x'+eid+'.';add(r.n,'Lavabo',k+'s',k+'b')})}
    if(r.t==='wc'){const kg='wcg'+r.id+'.';WCF.forEach((c,j)=>add(r.n,c,kg+j,null));const ks='wcs'+r.id+'.';add(r.n,'Lave-main',ks+'s',ks+'b')}
  });
  const bIv=S.baseline.iv||[];
  S.iv.forEach(cur=>{
    const base=bIv.find(b=>b.id===cur.id);
    const k='iv'+cur.id,ks=k+'s',kn=k+'n',ka=k+'a';
    let status='same',s1='—',s2='—';const detail=[];
    if(base){
      const n1=parseInt(bv[kn])||0,n2=parseInt(S.v[kn])||0,st1=bv[ks],st2=S.v[ks];
      if(n2<n1)status='deg';
      else if(st1!==st2){
        if(SEV[st1]!==undefined&&SEV[st2]!==undefined)status=SEV[st2]>SEV[st1]?'deg':(SEV[st2]<SEV[st1]?'better':'same');
        else status='diff';
      }
      if(n2!==n1)detail.push('Nb '+n1+' → '+n2);
      if(st1!==st2)detail.push('État '+(st1||'—')+' → '+(st2||'—'));
      s1=String(n1);s2=String(n2);
    }
    const aspect=S.v[ka],aspectBad=aspect==='ME'||aspect==='HS';
    const flag1=!!S.v[k+'1'],flag2=!!S.v[k+'2'];
    if((aspectBad||flag1||flag2)&&status==='same')status='deg';
    if(status==='same'&&!aspectBad&&!flag1&&!flag2)return;
    if(aspectBad)detail.push('Aspect '+aspect);
    const label=S.v[k+'d']||(base&&bv[k+'d'])||'Objet';
    out.push({roomLabel:'Inventaire',name:label+(detail.length?' — '+detail.join(', '):''),sk:k+'.qtydeg',obsKey:k+'b',s1,s2,status,flag1,flag2});
  });
  const bKl=S.baseline.kl||[];
  S.kl.forEach(cur=>{
    const base=bKl.find(b=>b.id===cur.id);if(!base)return;
    const k='kl'+cur.id+'.',q1=parseInt(bv[k+'q'])||0,q2=parseInt(S.v[k+'q'])||0;
    if(q2<q1)out.push({roomLabel:'Clés',name:(cur.n||'Clé')+' — quantité '+q1+' → '+q2,sk:k+'qtydeg',obsKey:null,s1:String(q1),s2:String(q2),status:'deg',flag1:false,flag2:false});
    const s1=bv[k+'s'],s2=S.v[k+'s'];
    if(s1!==s2&&(SEV[s1]!==undefined||SEV[s2]!==undefined)){
      const st=SEV[s1]!==undefined&&SEV[s2]!==undefined?(SEV[s2]>SEV[s1]?'deg':(SEV[s2]<SEV[s1]?'better':'same')):'diff';
      if(st!=='same')out.push({roomLabel:'Clés',name:(cur.n||'Clé')+' — état',sk:k+'s',obsKey:null,s1,s2,status:st,flag1:false,flag2:false});
    }
  });
  if(S.v.net==='Moyen'||S.v.net==='Médiocre'){
    out.push({roomLabel:'Nettoyage général',name:'État du nettoyage à la sortie',sk:'netg_flag',obsKey:'netgb',s1:'—',s2:S.v.net,status:'deg',flag1:false,flag2:false});
  }
  return out;
}

function onIn(e){
  const t=e.target;
  if(t.classList.contains('ob'))grow(t);
  if(t.dataset.rn){const r=S.rooms.find(x=>x.id===t.dataset.rn);r.n=t.value;save();return}
  if(t.dataset.nmid){const arr=t.dataset.nmtag==='an'?S.an:S.kl,o=arr.find(x=>x.id===t.dataset.nmid);if(o)o.n=t.value;save();return}
  if(t.dataset.chifroom){ensureChif();const room=S.chif.rooms.find(r=>String(r.id)===String(t.dataset.chifroom));if(room)room.name=t.value;save();return}
  if(t.dataset.chifline){ensureChif();const parts=t.dataset.chifline.split('.');const rid=parts[0],lid=parts[1],field=parts[2];const room=S.chif.rooms.find(r=>String(r.id)===String(rid));const line=room&&room.lines.find(l=>String(l.id)===String(lid));if(!line)return;
    if(field==='qty'||field==='prix'||field==='coef')line[field]=parseFloat(t.value)||0;
    else if(field==='typeT'){line.typeT=parseInt(t.value)||1;line.coef=computeCoef(line.grille,line.etat,line.typeT)}
    else if(field==='etat'){line.etat=t.value;line.coef=computeCoef(line.grille,line.etat,line.typeT)}
    else if(field==='lib'){
      line.lib=t.value;
      // Recherche live dans le catalogue → nouvelles suggestions cliquables
      const hits=searchCatalogByQuery(t.value,10);
      line.suggestions=hits;
      // Si correspondance exacte, associer le poste (prix/coef) sans écraser la frappe
      const exact=hits.find(g=>g.lib.toLowerCase()===t.value.toLowerCase().trim());
      if(exact){
        line.grille=exact;line.prix=exact.prix;line.unit=exact.unit||'u';
        line.coef=computeCoef(exact,line.etat,line.typeT);
      }
      save();
      renderLineSuggestions(rid,lid);

      const pos=t.selectionStart;

      const el=document.getElementById('catSearch');
      if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}
    },200);
    return}
  if(t.dataset.catcat){catCat=t.value;render();return}
  if(t.dataset.catedit){return}
  if(t.dataset.k&&!t.classList.contains('c')){S.v[t.dataset.k]=t.value;save();const o=$('#tot');if(o)o.textContent=total()}
}

  if(S.v['cles.done'])h+=`<h2>Clés</h2><table>${S.kl.map(o=>{const k='kl'+o.id+'.';return row(o.n||'Clé',[S.v[k+'q']&&('qté '+S.v[k+'q']),S.v[k+'s']].filter(Boolean).join(' · '))}).join('')}${row('Total',String(total()))}${row('Observations',S.v.clesgb)}</table>${(S.ph.cles||[]).map(d=>`<img src="${d}">`).join('')}`;
  if(isSortant()&&S.v['net.done'])h+=`<h2>Nettoyage général</h2><table>${row('État',S.v.net)}${row('Observations',S.v.netgb)}</table>`;
  h+=`<h2>Signatures</h2><table>${row('Date d’entrée',fmtDate(S.v.dent))}${row('Commentaire du locataire',S.v.com)}</table>`;
  SIG.forEach(([k,l,d])=>{if(S.v[k]||nm(k,d))h+=`<p>${esc(l)} ${esc(nm(k,d))}${k==='sgX'?'<br>'+esc(S.v.sgXadr||'485, chemin Thomas Garbies 06610 La Gaude')+(S.v.heurefin?'<br>Heure de fin : '+esc(S.v.heurefin):''):''}<br>${S.v[k]?`<img src="${S.v[k]}" style="max-width:260px;border:1px solid #999">`:''}</p>`});
  h+=`<h2>Légende</h2><p style="font-size:13px;color:#5d6d76">États : NV non vérifié · NF neuf · BE bon état · EU état d’usage · ME mauvais état · HS hors service<br>
    TrCh : Trous de Chevilles<br>TDH : Traces D’Habitation<br>TDHP : Traces D’Habitation Prononcées<br>DDE : Dégât Des Eaux<br>
    1 = à réparer ou changer · 2 = à nettoyer</p>`;
  const sum=Object.keys(STL).map(k=>cnt[k]?`<span class="sc" style="background:${STCLR[k]}">${cnt[k]} ${STL[k]}</span>`:'').join('')
    +(cnt.r1?`<span class="sc" style="background:${STCLR.ME}">${cnt.r1} à réparer</span>`:'')
    +(cnt.r2?`<span class="sc" style="background:${STCLR.NV}">${cnt.r2} à nettoyer</span>`:'');
  const bandEnd=h.indexOf('</div>')+6;
  return h.slice(0,bandEnd)+(sum?`<div class="sum">${sum}</div>`:'')+h.slice(bandEnd);
}

function isObj(x){return x&&typeof x==='object'&&!Array.isArray(x)}
function applyImport(j,toSortie){
  if(!isObj(j)){msg('Fichier invalide : ce n’est pas un EDL exporté par cette app');return}
  const rooms=Array.isArray(j.rooms)&&j.rooms.length?j.rooms:S.rooms;
  const cp=Array.isArray(j.cp)&&j.cp.length?j.cp:S.cp;
  const iv=Array.isArray(j.iv)?j.iv:[];
  const an=Array.isArray(j.an)&&j.an.length?j.an:S.an;
  const kl=Array.isArray(j.kl)&&j.kl.length?j.kl:S.kl;
  const v=isObj(j.v)?j.v:{};
  const x=isObj(j.x)?j.x:{};
  const san=isObj(j.san)?j.san:{};
  const ph=isObj(j.ph)?j.ph:{};
  try{
    const newBaseline=toSortie?clone({v,rooms,x,san,iv,kl}):(isObj(j.baseline)?clone(j.baseline):null);
    S.v=v;S.rooms=rooms;S.cp=cp;S.x=x;S.iv=iv;S.san=san;S.an=an;S.kl=kl;S.ph=ph;
    S.baseline=newBaseline;S.chif=isObj(j.chif)?j.chif:null;
    if(toSortie){
      S.v.sensS=true;delete S.v.sensE;
      if(S.v.ent)S.v.sor=S.v.ent;if(S.v.entem)S.v.sorem=S.v.entem;if(S.v.entte)S.v.sorte=S.v.entte;
      delete S.v.ent;delete S.v.entem;delete S.v.entte;
      S.ph={};
      SIG.forEach(([k])=>{delete S.v[k]});
      S.rooms.forEach(r=>{delete S.v[r.id+'.done']});
      if(!S.v.dent&&S.v.date)S.v.dent=S.v.date;
      delete S.v.rdv;delete S.v.date;delete S.v.heure;
    }
    S.tab='gen';render();save();savePh();
    msg(toSortie?'Repris pour la sortie — relis chaque pièce':'EDL rouvert');
  }catch(e){
    console.error(e);
    msg('Import impossible — fichier illisible ou incompatible');
  }
}

// ===== Pré-remplissage automatique depuis les paramètres d'URL (Jotform) =====
(function prefillFromURL() {
  try {
    const params = new URLSearchParams(window.location.search);
    if (params.size === 0) return;
    const get = (key) => {
      const val = params.get(key);
      return val ? decodeURIComponent(val.replace(/\+/g, ' ')).trim() : '';
    };
    let filled = 0;
    if (get('rdv')) { S.v.rdv = get('rdv'); filled++; }
    const rawDate = get('date');
    if (rawDate) {
      const m = rawDate.match(/([A-Za-z]+)\s+(\d{1,2}),\s+(\d{4})\s+(\d{1,2}:\d{2})/);
      if (m) {
        const months = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
        const month = months[m[1].toLowerCase().slice(0,3)];
        if (month) {
          S.v.date = m[3] + '-' + String(month).padStart(2,'0') + '-' + String(m[2]).padStart(2,'0');
          S.v.heure = m[4]; filled += 2;
        } else { S.v.date = rawDate; filled++; }
      } else { S.v.date = rawDate; filled++; }
    }
    if (get('heure') && get('heure') !== 'Array') { S.v.heure = get('heure'); filled++; }
    if (get('statut')) { S.v.statut = get('statut'); filled++; }
    if (get('client')) { S.v.client = get('client'); filled++; }
    if (get('cliente')) { S.v.cliente = get('cliente'); filled++; }
    if (get('clientte')) { S.v.clientte = get('clientte'); filled++; }
    if (get('prop')) { S.v.prop = get('prop'); filled++; }
    if (get('adr')) { S.v.adr = get('adr'); filled++; }
    const villeRaw = get('ville');
    if (villeRaw) {
      if (villeRaw.includes('\t')) {
        const parts = villeRaw.split('\t');
        S.v.cp = parts[0].trim();
        S.v.ville = parts[1] ? parts[1].trim() : '';
      } else if (/^\d{5}/.test(villeRaw)) {
        S.v.cp = villeRaw.substring(0, 5);
        S.v.ville = villeRaw.substring(5).trim();
      } else { S.v.ville = villeRaw; }
      filled++;
    }
    if (get('cp')) { S.v.cp = get('cp'); filled++; }
    if (get('meub')) { S.v.meub = get('meub'); filled++; }
    if (get('sousType')) { S.v.sousType = get('sousType'); filled++; }
    if (get('typ')) { S.v.typ = get('typ'); filled++; }
    if (get('etage')) { S.v.etage = get('etage'); filled++; }
    if (get('ent')) { S.v.ent = get('ent'); filled++; }
    if (get('entem')) { S.v.entem = get('entem'); filled++; }
    if (get('entte')) { S.v.entte = get('entte'); filled++; }
    if (get('sor')) { S.v.sor = get('sor'); filled++; }
    if (get('sorem')) { S.v.sorem = get('sorem'); filled++; }
    if (get('sorte')) { S.v.sorte = get('sorte'); filled++; }
    if (get('sensE') === '1' || get('type') === 'entree') { S.v.sensE = true; delete S.v.sensS; filled++; }
    if (get('sensS') === '1' || get('type') === 'sortie') { S.v.sensS = true; delete S.v.sensE; filled++; }
    if (filled > 0) {
      S.tab = 'gen';
      try { save(); } catch(e) {}
      try { msg(filled + ' champ(s) pré-rempli(s) depuis Jotform'); } catch(e) {}
    }
  } catch(e) { console.error('Erreur prefillFromURL', e); }
})();
